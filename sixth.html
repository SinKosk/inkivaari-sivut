            <h2>Kirjoita terveisesi Inkiväärille!</h2>
    <form class="vieraskirja-form">
      <label for="nimi">Nimi:</label><br>
      <input type="text" id="nimi" name="nimi" required><br><br>

      <label for="viesti">Viesti:</label><br>
      <textarea id="viesti" name="viesti" rows="5" required></textarea><br><br>

      <button type="submit">Lähetä</button>
    </form>
    <p><em>Huom! Tämä lomake ei tallenna viestejä — se on vain esittelykäyttöön.</em></p>
